services:
  front:
    image: node:24-alpine
    container_name: bank-account-mngt-front
    working_dir: /app
    # The dev server can exit when a watched file is deleted under it: bring it back.
    restart: unless-stopped
    command: sh -c "npm ci && npm run dev -- --host 0.0.0.0"
    # File events do not always cross the bind mount: without polling, Vite
    # misses files added while it runs (new public assets fall back to index.html).
    environment:
      CHOKIDAR_USEPOLLING: "true"
    ports:
      - "127.0.0.1:${PORT:-8080}:8080"
    volumes:
      - .:/app
      - node_modules:/app/node_modules

volumes:
  node_modules:
